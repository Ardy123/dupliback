name: Tests

on:
  pull_request:
  push:
    branches: [master]
  # lets the release workflow run the same checks before building packages
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    # the supported base, so the tests use its duplicity (3.0.6)
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # before checkout, which needs git to clone with history
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y git python3-venv python3-gi python3-dbus \
            gir1.2-gtk-3.0 duplicity xvfb

      - uses: actions/checkout@v4

      - name: Trust the checkout and show duplicity's version
        # the container runs as root, the checkout is owned by the runner
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          duplicity --version

      - name: Create .venv
        run: dupliback/setup_venv.sh

      - name: Run tests with coverage
        working-directory: dupliback
        # the tests start their own Xvfb display for the GUI tests, which count
        # towards coverage; .coveragerc fails the run below 80%
        run: .venv/bin/python -m pytest --cov --cov-report=term-missing

  packages:
    name: packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build deb and rpm
        run: |
          ./build_deb.sh -b
          ./build_rpm.sh -b

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dupli.back-*.deb
            dupli.back-*.rpm

  install:
    # installs each package into a bare image, so a dependency missing from
    # control or the spec fails here rather than on a user's machine
    name: install on ${{ matrix.image }}
    needs: packages
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # duplicity >= 3.0.6: Ubuntu 26.04 (3.0.6), Debian unstable (3.1);
          # Ubuntu 24.04 (2.1) and Debian 13 (3.0.4) are too old
          - image: ubuntu:26.04
            install: apt-get update && apt-get install -y ./dupli.back-*.deb
          - image: debian:unstable
            install: apt-get update && apt-get install -y ./dupli.back-*.deb
          - image: fedora:latest
            install: dnf install -y ./dupli.back-*.noarch.rpm
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages

      - name: Install the package and its dependencies
        run: ${{ matrix.install }}

      - name: Check the app starts and its commands exist
        # the usage path imports every module, so this needs all the python
        # and gtk dependencies
        run: |
          python3 /usr/share/dupliback/dupliback.py --usage \
            | grep 'to backup all detected repositories'
          for cmd in duplicity udevadm mount df tar xdg-open gpg; do
            command -v "$cmd" || { echo "missing $cmd"; exit 1; }
          done
