name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  packages:
    name: attach packages
    needs: tests
    runs-on: ubuntu-24.04
    # uploads the packages to the release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Check the tag matches the application version
        env:
          TAG: ${{ github.event.release.tag_name }}
          DUPLIBACK_RELEASE: 1
        run: |
          source packaging/build_common.sh
          set_versions
          version="$VERSION"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::tag $TAG does not match version $version" \
                 "in dupliback/src/settings.py"
            exit 1
          fi
          dated_entry="^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}"
          if ! grep -qE "$dated_entry" CHANGELOG.md; then
            echo "::error::CHANGELOG.md needs a dated entry for $version" \
                 "(replace 'Unreleased' with the release date)"
            exit 1
          fi

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build deb and rpm
        run: |
          ./build_deb.sh -r -b
          ./build_rpm.sh -r -b

      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "$TAG" --clobber
          dupli.back-*.deb dupli.back-*.noarch.rpm

  start-next-version:
    name: open a pull request starting the next version
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Bump the version and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          released="${TAG#v}"
          next="$(python3 packaging/start_next_version.py "$released")"
          if [ -z "$next" ]; then
            echo "$BASE is already past $released, nothing to do"
            exit 0
          fi
          branch="chore/start-$next"
          if git ls-remote --exit-code --heads origin "$branch"; then
            echo "$branch already exists, leaving it alone"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email \
              '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "Start $next" \
              -m "$released is released, so the version moves on to $next."
          git push origin "$branch"
          gh pr create --base "$BASE" --head "$branch" --title "Start $next" \
              --body "$released is released. This bumps \`PROGRAM_BASE_VERSION\`
          to $next and opens its \"Unreleased\" section in \`CHANGELOG.md\`.
          Merge it to start work on $next; for a patch release instead, edit
          the version here before merging."
          gh workflow run tests.yml --ref "$branch"
