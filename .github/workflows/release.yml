name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  packages:
    name: attach packages
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check the tag matches the application version
        env:
          TAG: ${{ github.event.release.tag_name }}
          DUPLIBACK_RELEASE: 1
        run: |
          source packaging/build_common.sh
          set_versions
          version="$VERSION"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::tag $TAG does not match version $version" \
                 "in dupliback/src/settings.py"
            exit 1
          fi
          dated_entry="^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}"
          if ! grep -qE "$dated_entry" CHANGELOG.md; then
            echo "::error::CHANGELOG.md needs a dated entry for $version" \
                 "(replace 'Unreleased' with the release date)"
            exit 1
          fi

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build deb and rpm
        run: |
          ./build_deb.sh -r -b
          ./build_rpm.sh -r -b

      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "$TAG" --clobber
          dupli.back-*.deb dupli.back-*.noarch.rpm
